<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos de la Boda - Joaquín & Karime</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdfbf7; color: #333; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #8c7355; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input[type="file"] { display: none; }
        .upload-btn { background: #8c7355; color: white; padding: 12px 25px; border-radius: 25px; cursor: pointer; display: inline-block; font-weight: bold; transition: background 0.3s; }
        .upload-btn:hover { background: #6f5940; }
        #status { margin-top: 15px; font-size: 14px; color: #555; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 30px; }
        .gallery-item { position: relative; cursor: pointer; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.02); }
        
        /* Botón de borrar sobre las fotos en modo admin */
        .delete-btn { display: none; position: absolute; top: 5px; right: 5px; background: #d9534f; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; text-align: center; line-height: 28px; }
        .admin-mode .delete-btn { display: block; }

        /* Modal para ver imagen grande */
        #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); text-align: center; }
        #modal img { max-width: 90%; max-height: 85vh; margin-top: 5vh; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #modal span { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }

        .admin-section { margin-top: 30px; font-size: 12px; }
        .admin-link { color: #8c7355; background: none; border: none; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Boda Joaquín & Karime</h1>
        <p>¡Comparte tus mejores momentos con nosotros! Sube una foto de la celebración.</p>
        
        <label for="fotoInput" class="upload-btn">Seleccionar o Tomar Foto</label>
        <input type="file" id="fotoInput" accept="image/*" capture="environment">
        
        <div id="status"></div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <h3>Galería en vivo</h3>
        <div class="gallery" id="galeriaContainer"></div>
        
        <div class="admin-section">
            <button class="admin-link" id="adminBtn">Modo Administrador (Borrar fotos)</button>
        </div>
    </div>

    <!-- Modal para imagen ampliada -->
    <div id="modal">
        <span id="closeModal">&times;</span>
        <img id="modalImg" src="">
    </div>

    <!-- SDKs de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzxP_p70Ml5La56yur6PlYpKaLNC1qUWI",
          authDomain: "boda-joaquin-karime.firebaseapp.com",
          projectId: "boda-joaquin-karime",
          storageBucket: "boda-joaquin-karime.firebasestorage.app",
          messagingSenderId: "881571294724",
          appId: "1:123456789...:web:..." // Mantiene tu appId original
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const fotoInput = document.getElementById('fotoInput');
        const statusDiv = document.getElementById('status');
        const galeriaContainer = document.getElementById('galeriaContainer');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');
        const adminBtn = document.getElementById('adminBtn');

        let isAdmin = false;
        const ADMIN_PASSWORD = "boda2026"; // <--- CAMBIA ESTA CONTRASEÑA A TU GUSTO

        // Comprimir imagen antes de subirla
        function comprimirImagen(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        // Subir foto
        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.textContent = "Procesando y subiendo foto...";
            try {
                const base64Image = await comprimirImagen(file);
                await addDoc(collection(db, "fotos"), {
                    imageUrl: base64Image,
                    timestamp: serverTimestamp()
                });
                statusDiv.textContent = "¡Foto subida con éxito! Gracias por compartir.";
                fotoInput.value = "";
                cargarGaleria();
            } catch (error) {
                console.error("Error al subir:", error);
                statusDiv.textContent = "Hubo un error al subir la foto.";
            }
        });

        // Cargar galería
        async function cargarGaleria() {
            try {
                const querySnapshot = await getDocs(collection(db, "fotos"));
                galeriaContainer.innerHTML = "";
                
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.imageUrl) {
                        const item = document.createElement('div');
                        item.className = 'gallery-item' + (isAdmin ? ' admin-mode' : '');

                        const img = document.createElement('img');
                        img.src = data.imageUrl;
                        img.onclick = () => {
                            modalImg.src = data.imageUrl;
                            modal.style.display = "block";
                        };

                        const deleteButton = document.createElement('button');
                        deleteButton.className = 'delete-btn';
                        deleteButton.innerHTML = '&times;';
                        deleteButton.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm("¿Estás seguro de querer borrar esta foto?")) {
                                await deleteDoc(doc(db, "fotos", documento.id));
                                cargarGaleria();
                            }
                        };

                        item.appendChild(img);
                        item.appendChild(deleteButton);
                        galeriaContainer.appendChild(item);
                    }
                });
            } catch (error) {
                console.error("Error al cargar galería:", error);
            }
        }

        // Control del Modal para cerrar
        closeModal.onclick = () => { modal.style.display = "none"; }
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

        // Activación del Modo Administrador
        adminBtn.onclick = () => {
            if (!isAdmin) {
                const pass = prompt("Introduce la contraseña de administrador:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    adminBtn.textContent = "Cerrar Modo Administrador";
                    cargarGaleria();
                } else if (pass !== null) {
                    alert("Contraseña incorrecta.");
                }
            } else {
                isAdmin = false;
                adminBtn.textContent = "Modo Administrador (Borrar fotos)";
                cargarGaleria();
            }
        };

        cargarGaleria();
    </script>
</body>
</html>
