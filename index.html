<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Joaquín & Karime | Riviera Maya</title>
    <!-- Google Fonts para un estilo elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f9f8f6;
            --color-card: #ffffff;
            --color-primary: #1b4d3e;
            --color-accent: #c5a880;
            --color-text: #4a4a4a;
            --color-light: #7a7a7a;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-banner {
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 60px 20px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
        }

        .header-banner h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            color: #f2ebd9;
        }

        .header-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .header-banner p {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin: 0;
        }

        .main-container {
            width: 90%;
            max-width: 600px;
            margin: -30px auto 40px auto;
            background: var(--color-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .upload-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .upload-card p {
            color: var(--color-light);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .input-nombre {
            width: 80%;
            max-width: 350px;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }

        .input-nombre:focus {
            border-color: var(--color-primary);
        }

        input[type="file"] { display: none; }

        .upload-btn {
            background: var(--color-primary);
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 77, 62, 0.2);
        }

        .upload-btn:hover {
            background: #14382c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 77, 62, 0.3);
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: var(--color-accent);
            font-weight: 500;
        }

        /* Sección de Galería */
        .gallery-section {
            width: 90%;
            max-width: 800px;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        .gallery-section h3 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            font-size: 26px;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background: #eee;
            aspect-ratio: 1;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        .guest-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 11px;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }

        .delete-btn {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(217, 83, 79, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            line-height: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
        }
        .admin-mode .delete-btn { display: block; }

        .load-more-section {
            margin: 30px 0;
        }

        .load-more-btn {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .load-more-btn:hover {
            background: var(--color-primary);
            color: white;
        }

        /* Modal / Visor */
        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-content-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90%;
            max-height: 75vh;
        }

        #modalImg {
            max-width: 80vw;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        #modalCaption {
            color: #f2ebd9;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            z-index: 1010;
            transition: color 0.2s;
        }
        #closeModal:hover { color: var(--color-accent); }

        .nav-arrow {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 30px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            margin: 0 20px;
            transition: background 0.3s;
            user-select: none;
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .admin-section {
            margin: 40px 0;
            text-align: center;
        }

        .admin-link {
            color: var(--color-light);
            background: transparent;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .admin-link:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
    </style>
</head>
<body>

    <!-- Banner Superior Estilo Playa / Resort -->
    <div class="header-banner">
        <h2>Riviera Maya • Barceló Grand Resort</h2>
        <h1>Joaquín & Karime</h1>
        <p>31 de Octubre, 2026</p>
    </div>

    <!-- Tarjeta Principal de Subida -->
    <div class="main-container upload-card">
        <h3>Comparte tus recuerdos</h3>
        <p>Sube las fotos que captures durante nuestra celebración.</p>
        
        <input type="text" id="nombreInvitado" class="input-nombre" placeholder="Tu nombre o familia (Opcional)">
        <br>
        
        <label for="fotoInput" class="upload-btn">📷 Subir Foto o Imagen</label>
        <input type="file" id="fotoInput" accept="image/*">
        
        <div id="status"></div>
    </div>

    <!-- Galería en Vivo -->
    <div class="gallery-section">
        <h3>Galería de Invitados</h3>
        <div class="gallery" id="galeriaContainer"></div>
        
        <div class="load-more-section" id="loadMoreSection" style="display: none;">
            <button class="load-more-btn" id="loadMoreBtn">Cargar más fotos</button>
        </div>
        
        <div class="admin-section">
            <button class="admin-link" id="adminBtn">Modo Administrador</button>
        </div>
    </div>

    <!-- Modal para imagen ampliada -->
    <div id="modal">
        <span id="closeModal">&times;</span>
        <button class="nav-arrow" id="prevBtn">&#10094;</button>
        <div class="modal-content-wrapper">
            <img id="modalImg" src="">
        </div>
        <button class="nav-arrow" id="nextBtn">&#10095;</button>
        <div id="modalCaption"></div>
    </div>

    <!-- SDKs de Firebase y lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzxP_p70Ml5La56yur6PlYpKaLNC1qUWI",
          authDomain: "boda-joaquin-karime.firebaseapp.com",
          projectId: "boda-joaquin-karime",
          storageBucket: "boda-joaquin-karime.firebasestorage.app",
          messagingSenderId: "881571294724",
          appId: "1:123456789...:web:..." 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const cloudName = "jiialc0i";
        const uploadPreset = "boda_upload";

        const fotoInput = document.getElementById('fotoInput');
        const nombreInput = document.getElementById('nombreInvitado');
        const statusDiv = document.getElementById('status');
        const galeriaContainer = document.getElementById('galeriaContainer');
        const loadMoreSection = document.getElementById('loadMoreSection');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        const closeModal = document.getElementById('closeModal');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const adminBtn = document.getElementById('adminBtn');

        let isAdmin = false;

        let listaFotos = []; 
        let itemsVisibleCount = 12; 
        const PHOTOS_PER_PAGE = 12; 

        // Subida de foto con nombre
        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const autor = nombreInput.value.trim() !== "" ? nombreInput.value.trim() : "Invitado especial";

            statusDiv.textContent = "Subiendo recuerdo a la nube...";
            try {
                const cloudinaryUrl = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", uploadPreset);

                const response = await fetch(cloudinaryUrl, { method: "POST", body: formData });
                const data = await response.json();
                
                if (!data.secure_url) throw new Error("No se pudo obtener la URL");

                await addDoc(collection(db, "fotos"), {
                    imageUrl: data.secure_url,
                    autor: autor,
                    timestamp: serverTimestamp()
                });

                statusDiv.textContent = "¡Foto subida con éxito! 🌴";
                fotoInput.value = "";
                nombreInput.value = "";
                await cargarGaleriaCompleta();
            } catch (error) {
                console.error("Error al subir:", error);
                statusDiv.textContent = "Hubo un error al subir la foto.";
            }
        });

        async function cargarGaleriaCompleta() {
            try {
                const q = query(collection(db, "fotos"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                listaFotos = [];
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.imageUrl) {
                        listaFotos.push({ 
                            id: documento.id, 
                            url: data.imageUrl, 
                            autor: data.autor || "Invitado" 
                        });
                    }
                });

                renderizarGaleriaVisual();
            } catch (error) {
                console.error("Error al cargar galería:", error);
            }
        }

        function renderizarGaleriaVisual() {
            galeriaContainer.innerHTML = "";

            if (listaFotos.length === 0) {
                galeriaContainer.innerHTML = "<p style='grid-column: 1/-1; color: #888;'>Aún no hay fotos. ¡Sé el primero en subir una!</p>";
                loadMoreSection.style.display = "none";
                return;
            }

            const fotosAMostrar = listaFotos.slice(0, itemsVisibleCount);

            fotosAMostrar.forEach((fotoObj, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item' + (isAdmin ? ' admin-mode' : '');

                const img = document.createElement('img');
                img.src = fotoObj.url;
                img.onclick = () => abrirModal(index);

                const tag = document.createElement('div');
                tag.className = 'guest-tag';
                tag.textContent = `📷 ${fotoObj.autor}`;

                const deleteButton = document.createElement('button');
                deleteButton.className = 'delete-btn';
                deleteButton.innerHTML = '&times;';
                deleteButton.onclick = async (e) => {
                    e.stopPropagation();
                    if (confirm("¿Borrar esta foto de la galería?")) {
                        await deleteDoc(doc(db, "fotos", fotoObj.id));
                        await cargarGaleriaCompleta();
                    }
                };

                item.appendChild(img);
                item.appendChild(tag);
                item.appendChild(deleteButton);
                galeriaContainer.appendChild(item);
            });

            if (itemsVisibleCount < listaFotos.length) {
                loadMoreSection.style.display = "block";
            } else {
                loadMoreSection.style.display = "none";
            }
        }

        loadMoreBtn.onclick = () => {
            itemsVisibleCount += PHOTOS_PER_PAGE;
            renderizarGaleriaVisual();
        };

        // Control del Modal, Flechas y Botón "Atrás"
        let currentIndex = 0;

        function abrirModal(index) {
            currentIndex = index;
            modalImg.src = listaFotos[currentIndex].url;
            modalCaption.textContent = `📷 Subida por: ${listaFotos[currentIndex].autor}`;
            modal.style.display = "flex";
            history.pushState({ modalOpen: true }, "");
        }

        function cerrarModal() {
            modal.style.display = "none";
        }

        window.onpopstate = () => {
            if (modal.style.display === "flex") {
                cerrarModal();
            }
        };

        closeModal.onclick = () => { 
            cerrarModal(); 
            if (window.history.state && window.history.state.modalOpen) {
                history.back();
            }
        };

        nextBtn.onclick = (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % listaFotos.length;
            modalImg.src = listaFotos[currentIndex].url;
            modalCaption.textContent = `📷 Subida por: ${listaFotos[currentIndex].autor}`;
        };

        prevBtn.onclick = (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + listaFotos.length) % listaFotos.length;
            modalImg.src = listaFotos[currentIndex].url;
            modalCaption.textContent = `📷 Subida por: ${listaFotos[currentIndex].autor}`;
        };

        // Modo Administrador consultando la contraseña directamente desde Firestore
        adminBtn.onclick = async () => {
            if (!isAdmin) {
                const pass = prompt("Introduce la contraseña de administrador:");
                if (pass === null) return;

                try {
                    // Consultamos el documento de configuración en Firestore
                    const docRef = doc(db, "configuracion", "admin");
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const passwordCorrecta = docSnap.data().password;

                        if (pass === passwordCorrecta) {
                            isAdmin = true;
                            adminBtn.textContent = "Cerrar Modo Administrador";
                            renderizarGaleriaVisual();
                        } else {
                            alert("Contraseña incorrecta.");
                        }
                    } else {
                        alert("No se encontró la configuración de administrador en la base de datos.");
                    }
                } catch (error) {
                    console.error("Error al verificar contraseña:", error);
                    alert("Error al verificar la contraseña.");
                }
            } else {
                isAdmin = false;
                adminBtn.textContent = "Modo Administrador";
                renderizarGaleriaVisual();
            }
        };

        cargarGaleriaCompleta();
    </script>
</body>
</html>
