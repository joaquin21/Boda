<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos de la Boda - Joaquín & Karime</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdfbf7; color: #333; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #8c7355; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input[type="file"] { display: none; }
        .upload-btn { background: #8c7355; color: white; padding: 12px 25px; border-radius: 25px; cursor: pointer; display: inline-block; font-weight: bold; transition: background 0.3s; }
        .upload-btn:hover { background: #6f5940; }
        #status { margin-top: 15px; font-size: 14px; color: #555; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 30px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Boda Joaquín & Karime</h1>
        <p>¡Comparte tus mejores momentos con nosotros! Sube una foto de la celebración.</p>
        
        <label for="fotoInput" class="upload-btn">Seleccionar o Tomar Foto</label>
        <input type="file" id="fotoInput" accept="image/*" capture="environment">
        
        <div id="status"></div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <h3>Galería en vivo</h3>
        <div class="gallery" id="galeriaContainer"></div>
    </div>

    <!-- SDKs de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tu configuración de Firebase que obtuviste hace un momento
        const firebaseConfig = {
          apiKey: "AIzaSyDzxP_p70Ml5La56yur6PlYpKaLNC1qUWI",
          authDomain: "boda-joaquin-karime.firebaseapp.com",
          projectId: "boda-joaquin-karime",
          storageBucket: "boda-joaquin-karime.firebasestorage.app",
          messagingSenderId: "881571294724",
          appId: "1:881571294724:web:4e88bc6464a42fb16d8f51"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const fotoInput = document.getElementById('fotoInput');
        const statusDiv = document.getElementById('status');
        const galeriaContainer = document.getElementById('galeriaContainer');

        // Función para comprimir la imagen antes de subirla para que encaje perfecto en Firestore
        function comprimirImagen(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        // Manejar la subida cuando el invitado selecciona una foto
        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.textContent = "Procesando y subiendo foto...";
            
            try {
                // Comprimir y convertir a Base64
                const base64Image = await comprimirImagen(file);

                // Guardar en Cloud Firestore
                await addDoc(collection(db, "fotos"), {
                    imageUrl: base64Image,
                    timestamp: serverTimestamp()
                });

                statusDiv.textContent = "¡Foto subida con éxito! Gracias por compartir.";
                fotoInput.value = "";
                cargarGaleria();
            } catch (error) {
                console.error("Error al subir:", error);
                statusDiv.textContent = "Hubo un error al subir la foto. Intenta de nuevo.";
            }
        });

        // Cargar las fotos existentes en la galería
        async function cargarGaleria() {
            try {
                const querySnapshot = await getDocs(collection(db, "fotos"));
                galeriaContainer.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.imageUrl) {
                        const img = document.createElement('img');
                        img.src = data.imageUrl;
                        galeriaContainer.appendChild(img);
                    }
                });
            } catch (error) {
                console.error("Error al cargar galería:", error);
            }
        }

        // Cargar al abrir la página
        cargarGaleria();
    </script>
</body>
</html>
