<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Joaquín & Karime | Riviera Maya</title>
    <!-- Google Fonts para un estilo elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f9f8f6;
            --color-card: #ffffff;
            --color-primary: #1b4d3e; /* Verde elegante / inspirado en la selva tropical de la Riviera */
            --color-accent: #c5a880;  /* Tono arena / dorado suave */
            --color-text: #4a4a4a;
            --color-light: #7a7a7a;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-banner {
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 60px 20px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
        }

        .header-banner h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            color: #f2ebd9;
        }

        .header-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .header-banner p {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin: 0;
        }

        .main-container {
            width: 90%;
            max-width: 600px;
            margin: -30px auto 40px auto;
            background: var(--color-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .upload-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .upload-card p {
            color: var(--color-light);
            font-size: 13px;
            margin-bottom: 25px;
        }

        input[type="file"] { display: none; }

        .upload-btn {
            background: var(--color-primary);
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27, 77, 62, 0.2);
        }

        .upload-btn:hover {
            background: #14382c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 77, 62, 0.3);
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: var(--color-accent);
            font-weight: 500;
        }

        /* Sección de Galería */
        .gallery-section {
            width: 90%;
            max-width: 800px;
            margin: 0 auto 50px auto;
            text-align: center;
        }

        .gallery-section h3 {
            font-family: 'Playfair Display', serif;
            color: var(--color-primary);
            font-size: 26px;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            background: #eee;
            aspect-ratio: 1;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        /* Botón de borrar (Administrador) */
        .delete-btn {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(217, 83, 79, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            line-height: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .admin-mode .delete-btn { display: block; }

        /* Modal / Visor de imagen grande */
        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            text-align: center;
        }

        #modal img {
            max-width: 90%;
            max-height: 85vh;
            margin-top: 6vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            transition: color 0.2s;
        }
        #closeModal:hover { color: var(--color-accent); }

        .admin-section {
            margin: 40px 0;
            text-align: center;
        }

        .admin-link {
            color: var(--color-light);
            background: transparent;
            border: 1px solid #ddd;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .admin-link:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
    </style>
</head>
<body>

    <!-- Banner Superior Estilo Playa / Resort -->
    <div class="header-banner">
        <h2>Riviera Maya • Barceló Grand Resort</h2>
        <h1>Joaquín & Karime</h1>
        <p>31 de Octubre, 2026</p>
    </div>

    <!-- Tarjeta Principal de Subida -->
    <div class="main-container upload-card">
        <h3>Comparte tus recuerdos</h3>
        <p>Sube las fotos que captures durante nuestra celebración.</p>
        
        <label for="fotoInput" class="upload-btn">📷 Subir Foto o Imagen</label>
        <input type="file" id="fotoInput" accept="image/*">
        
        <div id="status"></div>
    </div>

    <!-- Galería en Vivo -->
    <div class="gallery-section">
        <h3>Galería de Invitados</h3>
        <div class="gallery" id="galeriaContainer"></div>
        
        <div class="admin-section">
            <button class="admin-link" id="adminBtn">Modo Administrador</button>
        </div>
    </div>

    <!-- Modal para imagen ampliada -->
    <div id="modal">
        <span id="closeModal">&times;</span>
        <img id="modalImg" src="">
    </div>

    <!-- SDKs de Firebase y lógica de Cloudinary -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDzxP_p70Ml5La56yur6PlYpKaLNC1qUWI",
          authDomain: "boda-joaquin-karime.firebaseapp.com",
          projectId: "boda-joaquin-karime",
          storageBucket: "boda-joaquin-karime.firebasestorage.app",
          messagingSenderId: "881571294724",
          appId: "1:123456789...:web:..." 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Datos de Cloudinary
        const cloudName = "jiialc0i";
        const uploadPreset = "boda_upload";

        const fotoInput = document.getElementById('fotoInput');
        const statusDiv = document.getElementById('status');
        const galeriaContainer = document.getElementById('galeriaContainer');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');
        const adminBtn = document.getElementById('adminBtn');

        let isAdmin = false;
        const ADMIN_PASSWORD = "boda2026";

        fotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.textContent = "Subiendo recuerdo a la nube...";
            try {
                // Preparamos los datos para enviarlos a Cloudinary
                const cloudinaryUrl = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", uploadPreset);

                // Subimos la foto directamente a Cloudinary
                const response = await fetch(cloudinaryUrl, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                if (!data.secure_url) {
                    throw new Error("No se pudo obtener la URL de Cloudinary");
                }

                // Guardamos únicamente el enlace seguro en Firebase Firestore
                await addDoc(collection(db, "fotos"), {
                    imageUrl: data.secure_url,
                    timestamp: serverTimestamp()
                });

                statusDiv.textContent = "¡Foto subida con éxito! 🌴";
                fotoInput.value = "";
                cargarGaleria();
            } catch (error) {
                console.error("Error al subir:", error);
                statusDiv.textContent = "Hubo un error al subir la foto.";
            }
        });

        async function cargarGaleria() {
            try {
                const querySnapshot = await getDocs(collection(db, "fotos"));
                galeriaContainer.innerHTML = "";
                
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.imageUrl) {
                        const item = document.createElement('div');
                        item.className = 'gallery-item' + (isAdmin ? ' admin-mode' : '');

                        const img = document.createElement('img');
                        img.src = data.imageUrl;
                        img.onclick = () => {
                            modalImg.src = data.imageUrl;
                            modal.style.display = "block";
                        };

                        const deleteButton = document.createElement('button');
                        deleteButton.className = 'delete-btn';
                        deleteButton.innerHTML = '&times;';
                        deleteButton.onclick = async (e) => {
                            e.stopPropagation();
                            if (confirm("¿Borrar esta foto de la galería?")) {
                                await deleteDoc(doc(db, "fotos", documento.id));
                                cargarGaleria();
                            }
                        };

                        item.appendChild(img);
                        item.appendChild(deleteButton);
                        galeriaContainer.appendChild(item);
                    }
                });
            } catch (error) {
                console.error("Error al cargar galería:", error);
            }
        }

        closeModal.onclick = () => { modal.style.display = "none"; }
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }

        adminBtn.onclick = () => {
            if (!isAdmin) {
                const pass = prompt("Introduce la contraseña de administrador:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    adminBtn.textContent = "Cerrar Modo Administrador";
                    cargarGaleria();
                } else if (pass !== null) {
                    alert("Contraseña incorrecta.");
                }
            } else {
                isAdmin = false;
                adminBtn.textContent = "Modo Administrador";
                cargarGaleria();
            }
        };

        cargarGaleria();
    </script>
</body>
</html>
